<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>PingCentral | Adjustable Terminal Height + Alarm</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-deep: #0a0c10;
            --bg-surface: #13161c;
            --bg-elevated: #1a1f2a;
            --border-subtle: #2c313c;
            --accent-success: #2ea44f;
            --accent-error: #f85149;
            --text-primary: #f0f3f8;
            --text-secondary: #8b949e;
            --text-muted: #5c6570;
            --font-mono: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace;
            --shadow-card: 0 8px 20px rgba(0, 0, 0, 0.3);
            --terminal-default-height: 95px;
        }

        body {
            background: var(--bg-deep);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            color: var(--text-primary);
            padding: 10px;
            min-height: 100vh;
        }

        /* Header with controls */
        header {
            margin-bottom: 5px;
            padding-bottom: 5px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 5px;
        }

        .title-section h1 {
            font-size: 26px;
            font-weight: 600;
            background: linear-gradient(135deg, #e6edf5, #9ab3cf);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .controls-panel {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
            background: var(--bg-elevated);
            padding: 8px 20px;
            border-radius: 60px;
            border: 1px solid var(--border-subtle);
        }

        .alarm-toggle {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            user-select: none;
            padding: 6px 12px;
            border-radius: 40px;
            background: #252b36;
            transition: 0.2s;
        }

        .alarm-toggle.active {
            background: #2ea44f30;
            border: 1px solid #2ea44f;
        }

        .toggle-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #8b949e;
            transition: 0.2s;
        }

        .alarm-toggle.active .toggle-indicator {
            background: #2ea44f;
            box-shadow: 0 0 6px #2ea44f;
        }

        .column-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .col-buttons {
            display: flex;
            gap: 6px;
        }

        .col-btn {
            background: #252b36;
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            width: 32px;
            height: 32px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            font-size: 13px;
        }

        .col-btn.active {
            background: var(--accent-success);
            color: white;
            border-color: var(--accent-success);
        }

        .col-btn:hover {
            background: #3a4150;
        }

        /* NEW: terminal height control */
        .height-control {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #252b36;
            padding: 4px 12px;
            border-radius: 40px;
            border: 1px solid var(--border-subtle);
        }
        .height-control label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            white-space: nowrap;
        }
        .height-control input {
            background: var(--bg-deep);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 13px;
            width: 65px;
            padding: 6px 8px;
            border-radius: 30px;
            text-align: center;
            font-weight: 500;
            transition: 0.1s;
        }
        .height-control input:focus {
            outline: none;
            border-color: var(--accent-success);
            box-shadow: 0 0 0 2px rgba(46, 164, 79, 0.2);
        }
        .height-control input:hover {
            border-color: var(--accent-success);
        }
        .height-unit {
            font-size: 11px;
            color: var(--text-muted);
            margin-left: -6px;
        }

        .status-badge {
            background: var(--bg-elevated);
            border-radius: 100px;
            padding: 6px 14px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border-subtle);
        }

        .live-dot {
            width: 10px;
            height: 10px;
            background-color: var(--accent-success);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--accent-success);
            animation: pulse 1.6s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        /* Dynamic Grid */
        .dashboard-grid {
            display: grid;
            gap: 10px;
            transition: all 0.2s;
        }

        .host-card {
            background: var(--bg-surface);
            border-radius: 10px;
            border: 1px solid var(--border-subtle);
            cursor: pointer;
            overflow: hidden;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .host-card:hover {
            border-color: var(--accent-success);
            transform: translateY(-2px);
        }

        .host-info-bar {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 5px;
            flex-wrap: wrap;
            gap: 4px;
            background: rgba(20, 25, 35, 0.5);
            border-bottom: 1px solid var(--border-subtle);
            flex-shrink: 0;
        }

        .host-title-group,
        .host-stats {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px;
        }

        .host-desc {
            font-family: var(--font-mono);
            font-weight: 400;
            font-size: 10px;
            background: #0b0e14;
            padding: 4px 12px;
            border-radius: 40px;
            border: 0.5px solid var(--border-subtle);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }


        .host-ip {
            font-size: 12px;
            color: var(--accent-success);
            background: #1f3a2a40;
            padding: 4px 12px;
            border-radius: 30px;
            font-weight: 600;
        }

        .host-stat {
            border: 1px solid var(--border-subtle);
            border-radius: 30px;
            color: var(--text-secondary);
            font-size: 10px;
            font-weight: 600;
            padding: 4px 8px;
            white-space: nowrap;
        }

        .host-stat.good {
            border-color: rgba(46, 164, 79, 0.7);
            color: #b9fbc0;
        }

        .host-stat.fair {
            border-color: rgba(210, 153, 34, 0.75);
            color: #ffd68a;
        }

        .host-stat.poor {
            border-color: rgba(248, 81, 73, 0.75);
            color: #ffc9c9;
        }

        .terminal-panel {
            margin: 7px;
            background: var(--bg-surface);
            border-radius: 5px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: height 0.2s ease;
        }

        .ping-graph {
            position: absolute;
            inset: 0;
            height: 80%;
            opacity: 0.7;
            pointer-events: none;
            width: 100%;
            z-index: 2;
        }

        .cli-scroll {
            position: relative;
            z-index: 1;
            font-family: var(--font-mono);
            font-size: 11px;
            line-height: 1.3;
            padding: 10px 12px;
            height: var(--terminal-height, 95px);
            min-height: 55px;
            overflow-y: auto;
            overflow-x: hidden;
            white-space: normal;
            background: rgba(1, 5, 12, 0.4);
            scroll-behavior: smooth;
            transition: height 0.15s ease;
        }

        .cli-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .cli-scroll::-webkit-scrollbar-track {
            background: #0f121b;
        }
        .cli-scroll::-webkit-scrollbar-thumb {
            background: #2ea44f60;
            border-radius: 6px;
        }

        .ping-entry {
            display: block;
            border-left: 2px solid transparent;
            padding-left: 8px;
            margin-bottom: 3px;
            font-size: 11px;
            overflow: hidden;
            text-overflow: clip;
            white-space: nowrap;
            animation: fadeSlide 0.08s ease-out;
        }

        .ping-success {
            color: #b9fbc0;
            border-left-color: var(--accent-success);
        }

        .ping-error {
            color: #ffc9c9;
            border-left-color: var(--accent-error);
            background: rgba(255, 0, 0, 0.08);
        }

        .ping-info {
            color: #8ab3ff;
        }

        .host-modal-backdrop {
            align-items: center;
            background: rgba(4, 7, 12, 0.4);
            display: none;
            inset: 0;
            justify-content: center;
            padding: 18px;
            position: fixed;
            z-index: 1000;
        }

        .host-modal-backdrop.open {
            display: flex;
        }

        .host-modal {
            background: var(--bg-surface);
            opacity: 0.98;
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
            display: flex;
            flex-direction: column;
            max-height: min(86vh, 760px);
            max-width: 1100px;
            overflow: hidden;
            width: min(94vw, 1100px);
        }

        .host-modal-header {
            align-items: center;
            background: rgba(20, 25, 35, 0.72);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            gap: 10px;
            justify-content: space-between;
            padding: 10px 12px;
        }

        .host-modal-title {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            min-width: 0;
        }

        .modal-close-btn {
            align-items: center;
            background: #252b36;
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            color: var(--text-primary);
            cursor: pointer;
            display: inline-flex;
            font-size: 18px;
            height: 32px;
            justify-content: center;
            line-height: 1;
            width: 32px;
        }

        .modal-close-btn:hover {
            border-color: var(--accent-error);
            color: #ffc9c9;
        }

        .modal-graph-wrap {
            background: #05080f;
            border-bottom: 1px solid var(--border-subtle);
            height: 260px;
            position: relative;
        }

        .modal-ping-graph {
            height: 100%;
            width: 100%;
        }

        .modal-cli-scroll {
            background: #01050c;
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 1.25;
            max-height: 360px;
            min-height: 220px;
            overflow-x: hidden;
            overflow-y: auto;
            padding: 12px 14px;
        }

        .footer-stats {
            margin-top: 32px;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-subtle);
            padding-top: 20px;
            display: flex;
            justify-content: center;
            gap: 28px;
            flex-wrap: wrap;
        }

        .skeleton-card {
            background: var(--bg-surface);
            border-radius: 20px;
            padding: 28px;
            border: 1px solid var(--border-subtle);
            height: 200px;
            animation: pulseSkeleton 1.4s infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            text-align: center;
        }

        @keyframes pulseSkeleton {
            0% { opacity: 0.5; }
            50% { opacity: 0.9; }
            100% { opacity: 0.5; }
        }

        .error-toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #f85149e6;
            backdrop-filter: blur(8px);
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 13px;
            z-index: 1000;
            animation: fadeInOut 2s ease forwards;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(20px); }
            15% { opacity: 1; transform: translateX(0); }
            85% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }

        @media (max-width: 700px) {
            body { padding: 12px; }
            .controls-panel { padding: 6px 14px; gap: 12px; }
            .height-control input { width: 55px; }
        }

		a:link {
		  color: #666;
		  text-decoration: none;
		}

		a:visited {
		  color: #666;
		}

		a:hover {
		  color: green;
		}

		a:active {
		  color: blue;
		}
    </style>
</head>
<body>

<header>
    <div class="top-row">
        <div class="title-section">
            <h1>📡 PingCentral</h1>
            <div style="font-size: 10px; color: var(--text-secondary); margin-top: 2px;">
                real-time ping dashboard | <a href="https://blog.mghla.net">made with ❤ by MgHla</a>
            </div>
        </div>
        <div class="controls-panel">
            <div id="alarmToggleBtn" class="alarm-toggle active">
                <div class="toggle-indicator"></div>
                <span>🔔 Error Alarm</span>
            </div>
            <!-- NEW: Terminal Height Input Box -->
            <div class="height-control">
                <label>📏 Terminal H:</label>
                <input type="number" id="terminalHeightInput" min="45" max="280" step="5" value="95">
                <span class="height-unit">px</span>
            </div>
            <div class="column-selector">
                <span style="font-size: 13px;">📐 cols:</span>
                <div class="col-buttons" id="colButtons">
                    <button data-col="1" class="col-btn">1</button>
                    <button data-col="2" class="col-btn">2</button>
                    <button data-col="3" class="col-btn active">3</button>
                    <button data-col="4" class="col-btn">4</button>
                    <button data-col="5" class="col-btn">5</button>
                    <button data-col="6" class="col-btn">6</button>
                </div>
            </div>
            <div class="status-badge">
                <span class="live-dot"></span>
                <span>LIVE</span>
                <span style="font-family: monospace;">WS</span>
            </div>
        </div>
    </div>
</header>

<div id="dashboardRoot" class="dashboard-grid" style="grid-template-columns: repeat(4, 1fr);">
    <div class="skeleton-card">⟳ Connecting to backend...</div>
    <div class="skeleton-card">📡 Waiting for host data</div>
    <div class="skeleton-card">🔊 Alarm rings on ping failure</div>
</div>

<div class="footer-stats">
    <span>✨ Adjust columns (1–6) | responsive layout</span>
    <span>🔴 Error = beep + red highlight</span>
    <span>📏 Terminal height: dynamic update</span>
</div>

<script>
    // ======================= CONFIGURATION =======================
    const WS_URL = (() => {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const host = window.location.hostname || 'localhost';
        const port = '3000';
        return `${protocol}//${host}:${port}`;
    })();
    
    let socket = null;
    let reconnectAttempts = 0;
    const MAX_RECONNECT = 8;
    let reconnectTimer = null;
    
    // Data state
    let currentHosts = [];         
    let terminalRefs = new Map();   
    let graphCanvasRefs = new Map(); 
    let pingHistory = new Map();    
    let hostStatRefs = new Map();   
    let activeModalIp = null;
    let hostModalRefs = null;
    const PING_GRAPH_LIMIT = 60;
    
    // Alarm state
    let alarmEnabled = true;
    let audioContext = null;
    let audioUnlocked = false;
    let pendingAlarmAfterUnlock = false;
    let lastAlarmTime = 0;
    const ALARM_THROTTLE_MS = 1500;
    
    // Column state
    let currentColumns = 3;
    
    // DOM elements
    const dashboardContainer = document.getElementById('dashboardRoot');
    const alarmToggleBtn = document.getElementById('alarmToggleBtn');
    const colButtons = document.querySelectorAll('.col-btn');
    const terminalHeightInput = document.getElementById('terminalHeightInput');
    
    // ======================= TERMINAL HEIGHT CONTROL =======================
    // Apply terminal height to all existing terminal panels
    function setTerminalHeight(pixels) {
        let height = parseInt(pixels);
        if (isNaN(height)) height = 95;
        height = Math.min(280, Math.max(45, height));
        terminalHeightInput.value = height;
        // Update CSS custom property for smooth changes
        document.documentElement.style.setProperty('--terminal-height', `${height}px`);
        // For each terminal scroll div, directly set height to override any inline
        for (let [ip, scrollDiv] of terminalRefs.entries()) {
            if (scrollDiv) {
                scrollDiv.style.height = `${height}px`;
                // Ensure the parent panel does not restrict
                const parentPanel = scrollDiv.closest('.terminal-panel');
                if (parentPanel) parentPanel.style.height = 'auto';
            }
        }
        // If modal is open, adjust its log area? Not necessary but keep nice
        if (activeModalIp && hostModalRefs && hostModalRefs.log) {
            // modal uses own scroll, but keep independent
        }
        localStorage.setItem('PingCentral_termHeight', height);
    }
    
    function initTerminalHeightControl() {
        const savedHeight = localStorage.getItem('PingCentral_termHeight');
        let defaultH = 95;
        if (savedHeight) {
            defaultH = parseInt(savedHeight);
            if (isNaN(defaultH)) defaultH = 95;
            defaultH = Math.min(280, Math.max(45, defaultH));
        }
        terminalHeightInput.value = defaultH;
        setTerminalHeight(defaultH);
        
        terminalHeightInput.addEventListener('input', (e) => {
            let val = parseInt(e.target.value);
            if (isNaN(val)) val = 95;
            val = Math.min(280, Math.max(45, val));
            setTerminalHeight(val);
        });
        terminalHeightInput.addEventListener('blur', () => {
            let val = parseInt(terminalHeightInput.value);
            if (isNaN(val)) val = 95;
            val = Math.min(280, Math.max(45, val));
            if (parseInt(terminalHeightInput.value) !== val) terminalHeightInput.value = val;
            setTerminalHeight(val);
        });
    }
    
    // ======================= AUDIO =======================
    function initAudio() {
        if (audioContext) return audioContext;
        try {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            return audioContext;
        } catch(e) { return null; }
    }
    
    function playAlarmBeep() {
        if (!alarmEnabled) return;
        const now = Date.now();
        if (now - lastAlarmTime < ALARM_THROTTLE_MS) return;
        let ctx = audioContext;
        if (!ctx) { ctx = initAudio(); if (!ctx) return; }
        const doBeep = () => {
            if (!alarmEnabled) return;
            lastAlarmTime = Date.now();
            const currentTime = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.value = 2080;
            gain.gain.value = 0.4;
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, currentTime + 0.4);
            osc.stop(currentTime + 0.4);
            const osc2 = ctx.createOscillator();
            const gain2 = ctx.createGain();
            osc2.connect(gain2);
            gain2.connect(ctx.destination);
            osc2.frequency.value = 660;
            gain2.gain.value = 0.28;
            osc2.start(currentTime + 0.08);
            gain2.gain.exponentialRampToValueAtTime(0.00001, currentTime + 0.48);
            osc2.stop(currentTime + 0.48);
            showToast("🔔 Ping failure alarm");
        };
        if (ctx.state === 'suspended') {
            pendingAlarmAfterUnlock = true;
            ctx.resume().then(() => {
                audioUnlocked = true;
                pendingAlarmAfterUnlock = false;
                doBeep();
            }).catch(e => console.log("audio resume fail"));
        } else {
            audioUnlocked = true;
            doBeep();
        }
    }
    
    function showToast(msg) {
        const toast = document.createElement('div');
        toast.className = 'error-toast';
        toast.innerText = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 1800);
    }
    
    function unlockAudioOnUserAction() {
        if (audioUnlocked && !pendingAlarmAfterUnlock) return;
        const ctx = audioContext || initAudio();
        if (ctx && ctx.state === 'suspended') {
            ctx.resume().then(() => { audioUnlocked = true; if(pendingAlarmAfterUnlock) {pendingAlarmAfterUnlock=false; playAlarmBeep();} });
        } else if (ctx) { audioUnlocked = true; if(pendingAlarmAfterUnlock) {pendingAlarmAfterUnlock=false; playAlarmBeep();} }
    }
    function setupAudioUnlock() {
        ['pointerdown', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, unlockAudioOnUserAction, { capture: true, passive: true }));
    }
    
    function setAlarmEnabled(enabled) {
        alarmEnabled = enabled;
        if (alarmEnabled) alarmToggleBtn.classList.add('active');
        else alarmToggleBtn.classList.remove('active');
        showToast(alarmEnabled ? "🔊 Alarm ON" : "🔇 Alarm OFF");
    }
    function setupAlarmToggle() {
        alarmToggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            unlockAudioOnUserAction();
            setAlarmEnabled(!alarmEnabled);
        });
        setAlarmEnabled(true);
    }
    
    // ======================= COLUMN CONTROL =======================
    function setColumns(cols) {
        if (cols < 1) cols = 1;
        if (cols > 6) cols = 6;
        currentColumns = cols;
        dashboardContainer.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        colButtons.forEach(btn => {
            const val = parseInt(btn.getAttribute('data-col'));
            btn.classList.toggle('active', val === cols);
        });
        localStorage.setItem('PingCentral_columns', cols);
    }
    function setupColumnButtons() {
        colButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const cols = parseInt(btn.getAttribute('data-col'));
                if (!isNaN(cols)) setColumns(cols);
            });
        });
        const saved = localStorage.getItem('PingCentral_columns');
        if (saved) { const sc = parseInt(saved); if (sc >= 1 && sc <= 6) setColumns(sc); }
        else setColumns(3);
    }
    
    // ======================= GRAPHICS & UTILITIES =======================
    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }
    function extractPingLatency(line, isError, isSuccess) {
        if (isError) return { value: null, error: true };
        if (!isSuccess) return null;
        const timeMatch = line.match(/time\s*([=<])\s*([0-9.]+)\s*ms/i);
        if (!timeMatch) return { value: 1, error: false };
        const value = parseFloat(timeMatch[2]);
        if (!Number.isFinite(value)) return { value: 1, error: false };
        return { value: timeMatch[1] === '<' ? Math.max(0.5, value) : value, error: false };
    }
    function addPingGraphSample(ip, sample) {
        if (!sample) return;
        const history = pingHistory.get(ip) || [];
        history.push(sample);
        while (history.length > PING_GRAPH_LIMIT) history.shift();
        pingHistory.set(ip, history);
        updateHostStats(ip);
        drawPingGraph(ip);
    }
    function getHostQuality(history) {
        if (!history.length) return { label: '--', level: '' };
        const errors = history.filter(item => item.error).length;
        const values = history.filter(item => !item.error && Number.isFinite(item.value)).map(item => item.value);
        const lossRate = errors / history.length;
        const avgLatency = values.length ? values.reduce((s,v)=>s+v,0)/values.length : Infinity;
        if (lossRate >= 0.2 || avgLatency >= 250 || values.length===0) return { label: 'Poor', level: 'poor' };
        if (lossRate >= 0.05 || avgLatency >= 100) return { label: 'Fair', level: 'fair' };
        return { label: 'Good', level: 'good' };
    }
    function updateHostStats(ip) {
        const refs = hostStatRefs.get(ip);
        if (!refs) return;
        const history = pingHistory.get(ip) || [];
        const errors = history.filter(item => item.error).length;
        const quality = getHostQuality(history);
        if(refs.quality) { refs.quality.textContent = quality.label; refs.quality.className = `host-stat ${quality.level}`.trim(); }
        if(refs.loss) { refs.loss.textContent = `Los: ${errors}`; refs.loss.className = errors>0 ? 'host-stat poor' : 'host-stat good'; }
    }
    function drawPingGraph(ip) {
        const canvas = graphCanvasRefs.get(ip);
        if (!canvas) return;
        const history = pingHistory.get(ip) || [];
        drawPingGraphCanvas(canvas, history);
    }
    function drawPingGraphCanvas(canvas, history) {
        const panel = canvas.parentElement;
        const width = Math.max(1, panel ? panel.clientWidth : canvas.clientWidth);
        const height = Math.max(1, panel ? panel.clientHeight : canvas.clientHeight);
        const scale = window.devicePixelRatio || 1;
        if (canvas.width !== Math.floor(width * scale) || canvas.height !== Math.floor(height * scale)) {
            canvas.width = Math.floor(width * scale);
            canvas.height = Math.floor(height * scale);
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;
        }
        const ctx = canvas.getContext('2d');
        if (!ctx) return;
        ctx.setTransform(scale,0,0,scale,0,0);
        ctx.clearRect(0,0,width,height);
        if (history.length < 2) return;
        const paddingX=8, paddingY=10;
        const graphWidth = Math.max(1, width - paddingX*2);
        const graphHeight = Math.max(1, height - paddingY*2);
        const values = history.filter(item => !item.error && Number.isFinite(item.value)).map(item=>item.value);
        const maxValue = Math.max(10, ...values) * 1.25;
        ctx.font = '10px monospace';
        ctx.fillStyle = 'rgba(240,243,248,0.62)';
        ctx.fillText('Latency ms', paddingX, paddingY+2);
        ctx.fillStyle = 'rgba(230,230,230,0.9)';
        ctx.fillText(`${Math.round(maxValue)} ms`, Math.max(paddingX, width-paddingX-44), paddingY+2);
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(0,100,100,0.2)';
        for (let i = 1; i <= 3; i++) { const y = paddingY + (graphHeight/4)*i; ctx.beginPath(); ctx.moveTo(paddingX,y); ctx.lineTo(width-paddingX,y); ctx.stroke(); }
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(0,200,255,0.85)';
        ctx.shadowBlur = 6;
        ctx.shadowColor = 'rgba(0,180,200,0.5)';
        let drawing = false;
        const xStepCount = Math.max(1, history.length-1);
        history.forEach((item, idx) => {
            const x = paddingX + (graphWidth * idx) / xStepCount;
            if (item.error || !Number.isFinite(item.value)) { drawing = false; return; }
            const clamped = Math.min(maxValue, Math.max(0, item.value));
            const y = paddingY + graphHeight - (clamped / maxValue) * graphHeight;
            if (!drawing) { ctx.beginPath(); ctx.moveTo(x, y); drawing = true; } else ctx.lineTo(x, y);
        });
        if(drawing) ctx.stroke();
        ctx.shadowBlur = 0;
        history.forEach((item, idx) => {
            if(!item.error) return;
            const x = paddingX + (graphWidth * idx) / xStepCount;
            ctx.fillStyle = 'rgba(248,81,73,0.9)';
            ctx.beginPath(); ctx.arc(x, paddingY+3, 3, 0, Math.PI*2); ctx.fill();
        });
    }
    
    // ======================= RENDER HOSTS with terminal height applied =======================
    function renderHosts(hosts) {
        if (!dashboardContainer) return;
        currentHosts = hosts || [];
        if (!currentHosts.length) {
            dashboardContainer.innerHTML = `<div class="skeleton-card" style="grid-column:1/-1;">📭 No hosts received.</div>`;
            terminalRefs.clear(); graphCanvasRefs.clear(); hostStatRefs.clear();
            return;
        }
        dashboardContainer.innerHTML = '';
        terminalRefs.clear(); graphCanvasRefs.clear(); hostStatRefs.clear();
        const currentHeight = parseInt(terminalHeightInput.value) || 95;
        currentHosts.forEach(host => {
            const ip = host.IPaddress;
            const description = host.Description || host.description || 'no label';
            const normalizedId = ip.replace(/\./g, '-');
            const card = document.createElement('div'); card.className = 'host-card'; card.setAttribute('data-ip', ip);
            card.addEventListener('click', () => openHostModal(ip));
            const infoBar = document.createElement('div'); infoBar.className = 'host-info-bar';
            infoBar.innerHTML = `<div class="host-desc">🏷️ ${escapeHtml(description)}</div><div class="host-ip">🌐 ${escapeHtml(ip)}</div>`;
            infoBar.insertAdjacentHTML('beforeend', `<div class="host-stats"><span id="quality-${normalizedId}" class="host-stat">Q: --</span><span id="loss-${normalizedId}" class="host-stat">Los: 0</span></div>`);
            const terminalPanel = document.createElement('div'); terminalPanel.className = 'terminal-panel';
            terminalPanel.innerHTML = `<canvas id="graph-${normalizedId}" class="ping-graph"></canvas><div id="term-${normalizedId}" class="cli-scroll" style="height: ${currentHeight}px;"><div class="ping-entry ping-info">⏳ monitoring ping stream...</div></div>`;
            card.appendChild(infoBar); card.appendChild(terminalPanel);
            dashboardContainer.appendChild(card);
            const scrollDiv = document.getElementById(`term-${normalizedId}`);
            if(scrollDiv) terminalRefs.set(ip, scrollDiv);
            const graphCanvas = document.getElementById(`graph-${normalizedId}`);
            if(graphCanvas) graphCanvasRefs.set(ip, graphCanvas);
            hostStatRefs.set(ip, { quality: document.getElementById(`quality-${normalizedId}`), loss: document.getElementById(`loss-${normalizedId}`) });
            drawPingGraph(ip);
            updateHostStats(ip);
        });
    }
    
    function appendPingLine(ip, rawLine) {
        const terminal = terminalRefs.get(ip);
        if (!terminal) return;
        let line = rawLine || '';
        const isError = /(timeout|timed out|unreachable|100% loss|ttl expired|failed|request timed out|destination host unreachable)/i.test(line);
        const isSuccess = /(time<|ttl=|bytes=|reply from|icmp_seq|time=)/i.test(line) && !isError;
        addPingGraphSample(ip, extractPingLatency(line, isError, isSuccess));
        let escaped = escapeHtml(line);
        let className = 'ping-entry';
        if(isError) { className+=' ping-error'; escaped = `🔴${escaped}`; if(alarmEnabled) playAlarmBeep(); }
        else if(isSuccess) { className+=' ping-success'; escaped = `🟢${escaped}`; }
        else { className+=' ping-info'; if(line.trim()) escaped = `ℹ️${escaped}`; }
        const lineDiv = document.createElement('div'); lineDiv.className = className; lineDiv.innerHTML = escaped;
        if(terminal.children.length === 1 && terminal.children[0].innerText.includes('monitoring ping stream')) terminal.innerHTML = '';
        terminal.appendChild(lineDiv);
        while(terminal.children.length > 400) terminal.removeChild(terminal.firstChild);
        terminal.scrollTop = terminal.scrollHeight;
        if(activeModalIp === ip) updateHostModal();
    }
    
    function ensureHostModal() { /* same robust modal */ if(hostModalRefs) return hostModalRefs;
        const backdrop = document.createElement('div'); backdrop.className = 'host-modal-backdrop';
        backdrop.innerHTML = `<div class="host-modal" tabindex="-1"><div class="host-modal-header"><div id="hostModalTitle" class="host-modal-title"></div><button type="button" class="modal-close-btn">×</button></div><div class="modal-graph-wrap"><canvas class="modal-ping-graph"></canvas></div><div class="modal-cli-scroll"></div></div>`;
        document.body.appendChild(backdrop);
        const closeBtn = backdrop.querySelector('.modal-close-btn');
        closeBtn.addEventListener('click', closeHostModal);
        backdrop.addEventListener('click', (e) => { if(e.target === backdrop) closeHostModal(); });
        document.addEventListener('keydown', (e) => { if(e.key === 'Escape' && backdrop.classList.contains('open')) closeHostModal(); });
        hostModalRefs = { backdrop, modal: backdrop.querySelector('.host-modal'), title: backdrop.querySelector('.host-modal-title'), graph: backdrop.querySelector('.modal-ping-graph'), log: backdrop.querySelector('.modal-cli-scroll') };
        return hostModalRefs;
    }
    function getHostInfo(ip) { return currentHosts.find(h=>h.IPaddress===ip) || { IPaddress: ip, Description: 'no label' }; }
    function openHostModal(ip) { const refs = ensureHostModal(); activeModalIp = ip; refs.backdrop.classList.add('open'); updateHostModal(); refs.modal.focus(); }
    function closeHostModal() { if(hostModalRefs) { activeModalIp = null; hostModalRefs.backdrop.classList.remove('open'); } }
    function updateHostModal() { if(!activeModalIp || !hostModalRefs) return; const host = getHostInfo(activeModalIp); const history = pingHistory.get(activeModalIp) || []; const quality = getHostQuality(history); const errors = history.filter(i=>i.error).length; const values = history.filter(i=>!i.error && Number.isFinite(i.value)).map(i=>i.value); const latest = values.length ? `${values[values.length-1]} ms` : '--'; hostModalRefs.title.innerHTML = `<span class="host-desc">${escapeHtml(host.Description||'')}</span><span class="host-ip">${escapeHtml(activeModalIp)}</span><span class="host-stat ${quality.level}">Quality: ${quality.label}</span><span class="host-stat ${errors>0?'poor':'good'}">Loss: ${errors}</span><span class="host-stat">Latest: ${latest}</span>`; drawPingGraphCanvas(hostModalRefs.graph, history); const term = terminalRefs.get(activeModalIp); if(term) { hostModalRefs.log.innerHTML = term.innerHTML; hostModalRefs.log.scrollTop = hostModalRefs.log.scrollHeight; } }
    
    // ======================= WEBSOCKET =======================
    function connectWebSocket() {
        if (socket && socket.readyState === WebSocket.OPEN) return;
        if (reconnectTimer) clearTimeout(reconnectTimer);
        try {
            socket = new WebSocket(WS_URL);
            socket.onopen = () => { reconnectAttempts = 0; };
            socket.onmessage = (e) => {
                try {
                    const data = JSON.parse(e.data);
                    if (data.type === 'init' && data.hosts) renderHosts(data.hosts);
                    else if (data.type === 'ping' && data.ip) appendPingLine(data.ip, data.line);
                } catch(err) {}
            };
            socket.onclose = () => {
                if (reconnectAttempts < MAX_RECONNECT) reconnectTimer = setTimeout(() => { reconnectAttempts++; connectWebSocket(); }, 2000 * Math.min(1.5, reconnectAttempts/2));
                else if(currentHosts.length === 0) dashboardContainer.innerHTML = `<div class="skeleton-card" style="grid-column:1/-1;">⚠️ Cannot connect to backend.<button onclick="location.reload()" style="margin-top:12px; background:#2ea44f; border:none; padding:6px 18px; border-radius:30px;">⟳ Retry</button></div>`;
            };
        } catch(e) {}
    }
    
    function init() {
        setupAlarmToggle();
        setupColumnButtons();
        initTerminalHeightControl();  // NEW: terminal height input & persistence
        initAudio();
        setupAudioUnlock();
        window.addEventListener('resize', () => { currentHosts.forEach(host => drawPingGraph(host.IPaddress)); updateHostModal(); });
        connectWebSocket();
        setInterval(() => { if(socket && socket.readyState !== WebSocket.OPEN && socket.readyState !== WebSocket.CONNECTING && reconnectAttempts < MAX_RECONNECT) connectWebSocket(); }, 5000);
    }
    init();
</script>
</body>
